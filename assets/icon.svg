<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243142"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf5a2"/>
      <stop offset="1" stop-color="#14a862"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#e8551c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Body (macOS grid: 824px squircle on a 1024px canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <g clip-path="url(#body)">
    <!-- Chat bubble with tail -->
    <g filter="url(#shadow)">
      <path fill="url(#bubble)" stroke="url(#bubble)" stroke-width="16" stroke-linejoin="round" d="
        M 340 250
        H 684
        A 120 120 0 0 1 804 370
        V 570
        A 120 120 0 0 1 684 690
        H 420
        L 300 790
        L 318 685
        A 120 120 0 0 1 220 570
        V 370
        A 120 120 0 0 1 340 250 Z"/>
    </g>

    <!-- W -->
    <polyline points="335,388 418,580 512,448 606,580 689,388"
              fill="none" stroke="#0b1d14" stroke-width="66"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Notification dot (Rust orange) -->
    <circle cx="790" cy="268" r="74" fill="#121821"/>
    <circle cx="790" cy="268" r="54" fill="url(#dot)"/>
  </g>
</svg>
