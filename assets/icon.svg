<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept B4 "Cyber Relay Monolith" (see assets/MOCKUPS.md) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1f23"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8f98"/>
      <stop offset="0.12" stop-color="#3b3e44"/>
      <stop offset="0.85" stop-color="#26282c"/>
      <stop offset="1" stop-color="#4a4d53"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e9ee" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#9aa0a8" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#6b7078" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b8bdc4" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <radialGradient id="beacon" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#ff7700"/>
    </radialGradient>
    <pattern id="hex" width="24" height="41.57" patternUnits="userSpaceOnUse">
      <path d="M12 0 L24 6.93 L24 20.78 L12 27.71 L0 20.78 L0 6.93 Z M12 27.71 V41.57"
            fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5"/>
    </pattern>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="face">
      <rect x="122" y="122" width="780" height="780" rx="165"/>
    </clipPath>
  </defs>

  <!-- Tile: outer metal rim, inset obsidian face, hex matrix texture -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#rim)"/>
  </g>
  <rect x="122" y="122" width="780" height="780" rx="165" fill="url(#tile)"/>
  <rect x="122" y="122" width="780" height="780" rx="165" fill="url(#hex)"/>
  <rect x="123.5" y="123.5" width="777" height="777" rx="163.5" fill="none" stroke="#000000" stroke-opacity="0.7" stroke-width="3"/>
  <rect x="116" y="116" width="792" height="792" rx="173" fill="none" stroke="url(#chrome)" stroke-width="4"/>
  <rect x="128" y="128" width="768" height="768" rx="159" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <g clip-path="url(#face)">
    <rect x="232" y="232" width="560" height="560" fill="url(#ambient)"/>

    <!-- Relay beacon pulse rings (behind the bubble) -->
    <g fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
      <path d="M641.1 322.2 A52 52 0 1 1 716 385" stroke-opacity="0.55"/>
      <path d="M611 311.3 A84 84 0 1 1 732 412.7" stroke-opacity="0.38"/>
      <path d="M581 300.3 A116 116 0 1 1 748 440.5" stroke-opacity="0.22"/>
    </g>

    <!-- Chat bubble outline, open at the top-right where the beacon sits -->
    <path id="bubble" d="M640 338 H330 V660 H390 V748 L472 660 H692 V392"
          fill="none" stroke="#00ff88" stroke-width="26" stroke-linejoin="miter" stroke-linecap="round"
          filter="url(#neon)" opacity="0.85"/>
    <path d="M640 338 H330 V660 H390 V748 L472 660 H692 V392"
          fill="none" stroke="#3dffa0" stroke-width="16" stroke-linejoin="miter" stroke-linecap="round"/>
    <path d="M640 338 H330 V660 H390 V748 L472 660 H692 V392"
          fill="none" stroke="#c8ffe4" stroke-opacity="0.55" stroke-width="4" stroke-linejoin="miter" stroke-linecap="round"/>

    <!-- W glyph -->
    <g filter="url(#drop)">
      <clipPath id="wclip"><rect x="380" y="418" width="264" height="190"/></clipPath>
      <polyline clip-path="url(#wclip)" points="422,378 470,582 512,474 554,582 602,378"
                fill="none" stroke="url(#glyph)" stroke-width="44" stroke-linejoin="miter" stroke-miterlimit="10"/>
    </g>

    <!-- Beacon -->
    <circle cx="690" cy="340" r="34" fill="#ff7700" filter="url(#soft)" opacity="0.9"/>
    <circle cx="690" cy="340" r="25" fill="url(#beacon)"/>
  </g>
</svg>
