# Build every platform when a version tag (v0.9.0, v0.9.0-rc1, …) is pushed to GitHub,
# and upload the builds with SHA256SUMS to a draft release for review.
#
# The macOS DMG is only ad-hoc signed: sign and notarize it locally, then replace it
# on the draft before publishing.
#
# "Run workflow" on the Actions tab builds everything without making a release; the
# builds are attached to the run as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # Gitea also runs .github/workflows; this is for GitHub only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read the version and check it matches the tag
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # zigbuild links against glibc 2.28, so the binary runs on any distro from
      # 2018 on; a plain cargo build would need the runner's newer glibc.
      - name: Install cargo-zigbuild
        run: |
          python3 -m venv ~/zigbuild
          ~/zigbuild/bin/pip install --quiet cargo-zigbuild==0.24.0 ziglang==0.16.0
          echo ~/zigbuild/bin >> "$GITHUB_PATH"
      - run: cargo zigbuild --release --no-default-features --target ${{ matrix.arch }}-unknown-linux-gnu.2.28
      - name: Package
        run: |
          mkdir -p out
          packaging/linux/package.sh target/${{ matrix.arch }}-unknown-linux-gnu/release/weechat-rs \
            ${{ matrix.arch }} ${{ needs.version.outputs.version }} out
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: out/*.zip
          if-no-files-found: error

  windows:
    # Cross-compiled with MinGW, like docker/Dockerfile.windows-x86_64, so the
    # executable needs no Visual C++ runtime.
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-gnu
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      - name: Package
        run: |
          mkdir -p out
          zip -j "out/WeeChatRS-${{ needs.version.outputs.version }}-windows-x86_64.zip" \
            target/x86_64-pc-windows-gnu/release/weechat-rs.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: out/*.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./build-macos.sh --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/macos/*.dmg
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # A re-run: replace the files, keep the notes already written.
            gh release upload "${TAG}" out/* --clobber
          else
            prerelease=""
            case "${TAG}" in *-*) prerelease="--prerelease" ;; esac
            gh release create "${TAG}" out/* --draft ${prerelease} \
              --title "WeeChatRS ${TAG#v}" --generate-notes
          fi
